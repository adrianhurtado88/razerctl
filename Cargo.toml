[package]
name = "razerctl"
version = "0.1.0"
edition = "2021"
description = "Tiny Razer peripheral controller (DPI, lighting, scroll wheel) - a lightweight alternative to Razer Synapse"

[dependencies]
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
